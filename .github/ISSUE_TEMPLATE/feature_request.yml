name: 기능 제안
description: 새 문법, 인터프리터 기능, 플레이그라운드 개선을 제안해 주세요.
title: "[제안] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        우사기랭은 우사기의 말로 쓰는 함수형 언어입니다. 이 방향에 맞는 제안이면 더 반갑습니다.

  - type: dropdown
    id: area
    attributes:
      label: 어느 부분인가요?
      options:
        - 언어 문법 · 동작
        - 인터프리터 · ura 명령
        - 플레이그라운드 (웹)
        - 문서 · 예제
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 불편하거나 아쉬운가요?
      description: 지금 무엇을 하려다가 막혔는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 새 문법이라면 어떤 우사기 말을 쓰고 어떻게 동작하면 좋을지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 예시 코드
      description: 제안이 들어갔을 때 쓰게 될 `.yaha` 코드와 기대하는 출력을 적어 주세요.
      render: text

  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
      description: 지금 문법으로 돌아가는 방법이나, 검토했지만 고르지 않은 방법이 있다면 적어 주세요.
